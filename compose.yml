name: eros

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eros}
      POSTGRES_USER: ${POSTGRES_USER:-eros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eros}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eros} -d ${POSTGRES_DB:-eros}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [eros]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [eros]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-erosadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-erosadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [eros]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >-
      sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$BUCKET || true &&
      mc anonymous set none local/$$BUCKET || true
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-erosadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-erosadmin123}
      BUCKET: ${S3_BUCKET:-eros}
    networks: [eros]

  crawler-migrate:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-eros}:${POSTGRES_PASSWORD:-eros}@postgres:5432/${POSTGRES_DB:-eros}
      REDIS_URL: redis://redis:6379
    command: ["bun", "run", "src/db/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [eros]

  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    restart: unless-stopped
    ports:
      - "${CRAWLER_PORT:-1337}:1337"
    environment:
      NODE_ENV: production
      PORT: 1337
      DATABASE_URL: postgres://${POSTGRES_USER:-eros}:${POSTGRES_PASSWORD:-eros}@postgres:5432/${POSTGRES_DB:-eros}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-eros:crawl}
      RECRAWL_INTERVAL_MS: ${RECRAWL_INTERVAL_MS:-60000}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-eros}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-erosadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-erosadmin123}
      S3_VIRTUAL_HOSTED_STYLE: ${S3_VIRTUAL_HOSTED_STYLE:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      crawler-migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    networks: [eros]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-1002}:1002"
    environment:
      NODE_ENV: production
      PORT: 1002
      CRAWLER_API_URL: http://crawler:1337
      CRAWLER_API_KEY: ${ENGINE_API_KEY:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      crawler: { condition: service_started }
    networks: [eros]

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  eros:
    driver: bridge
